<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Ambient blue glow -->
    <radialGradient id="ambient" cx="78%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.09"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle background grid -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">

      <path d="M45 0H0V45"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.028"/>
    </pattern>

    <!-- Network gradient -->
    <linearGradient id="network"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#334155"
            stop-opacity="0.1"/>

      <stop offset="50%"
            stop-color="#64748b"
            stop-opacity="0.65"/>

      <stop offset="100%"
            stop-color="#334155"
            stop-opacity="0.1"/>

    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND                                        -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="16"
        fill="url(#bg)"/>

  <rect width="1200"
        height="300"
        rx="16"
        fill="url(#ambient)"/>

  <rect width="1200"
        height="300"
        rx="16"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- LEFT SIDE                                         -->
  <!-- ================================================= -->

  <g font-family="Arial, Helvetica, sans-serif">

    <!-- Name -->
    <text x="78"
          y="105"
          font-size="12"
          letter-spacing="5"
          fill="#64748b">
      PRATHMESH
    </text>


    <!-- Main heading -->
    <text x="75"
          y="158"
          font-size="46"
          font-weight="700"
          letter-spacing="-2"
          fill="#f1f5f9">
      BUILDING WITH AI
    </text>


    <!-- Subtitle -->
    <text x="78"
          y="192"
          font-size="15"
          letter-spacing="0.7"
          fill="#94a3b8">
      Exploring LLMs, RAG, machine learning &amp; backend systems
    </text>


    <!-- Technology line -->
    <text x="78"
          y="240"
          font-family="monospace"
          font-size="10"
          letter-spacing="2"
          fill="#475569">
      LLMs · RAG · ML · BACKEND · SYSTEMS
    </text>

  </g>


  <!-- ================================================= -->
  <!-- AI / NEURAL NETWORK                               -->
  <!-- ================================================= -->

  <g>

    <!-- ----------------------------------------------- -->
    <!-- NETWORK CONNECTIONS                             -->
    <!-- ----------------------------------------------- -->

    <g fill="none"
       stroke="url(#network)"
       stroke-width="1">

      <!-- Input layer → hidden layer -->

      <path d="M690 90 L760 125"/>
      <path d="M690 150 L760 125"/>
      <path d="M690 210 L760 125"/>

      <path d="M690 90 L760 185"/>
      <path d="M690 150 L760 185"/>
      <path d="M690 210 L760 185"/>


      <!-- Hidden layer → embedding layer -->

      <path d="M760 125 L835 95"/>
      <path d="M760 125 L835 155"/>
      <path d="M760 125 L835 215"/>

      <path d="M760 185 L835 95"/>
      <path d="M760 185 L835 155"/>
      <path d="M760 185 L835 215"/>


      <!-- Embedding → reasoning -->

      <path d="M835 95 L915 130"/>
      <path d="M835 155 L915 130"/>
      <path d="M835 215 L915 130"/>

      <path d="M835 95 L915 195"/>
      <path d="M835 155 L915 195"/>
      <path d="M835 215 L915 195"/>


      <!-- Reasoning → output layer -->

      <path d="M915 130 L990 100"/>
      <path d="M915 130 L990 160"/>
      <path d="M915 130 L990 220"/>

      <path d="M915 195 L990 100"/>
      <path d="M915 195 L990 160"/>
      <path d="M915 195 L990 220"/>


      <!-- Output -->

      <path d="M990 100 L1070 160"/>
      <path d="M990 160 L1070 160"/>
      <path d="M990 220 L1070 160"/>

    </g>


    <!-- ----------------------------------------------- -->
    <!-- FADE-IN / FADE-OUT SIGNALS                      -->
    <!-- ----------------------------------------------- -->

    <!-- Upper signal -->

    <path d="M690 90
             L760 125
             L835 95
             L915 130
             L990 100
             L1070 160"

          fill="none"
          stroke="#60a5fa"
          stroke-width="1.3"
          opacity="0">

      <animate
        attributeName="opacity"
        values="0;0.65;0"
        dur="5s"
        begin="0s"
        repeatCount="indefinite"/>

    </path>


    <!-- Middle signal -->

    <path d="M690 150
             L760 125
             L835 155
             L915 130
             L990 160
             L1070 160"

          fill="none"
          stroke="#60a5fa"
          stroke-width="1.3"
          opacity="0">

      <animate
        attributeName="opacity"
        values="0;0.75;0"
        dur="4.5s"
        begin="1.4s"
        repeatCount="indefinite"/>

    </path>


    <!-- Lower signal -->

    <path d="M690 210
             L760 185
             L835 215
             L915 195
             L990 220
             L1070 160"

          fill="none"
          stroke="#60a5fa"
          stroke-width="1.2"
          opacity="0">

      <animate
        attributeName="opacity"
        values="0;0.5;0"
        dur="5s"
        begin="2.4s"
        repeatCount="indefinite"/>

    </path>


    <!-- ----------------------------------------------- -->
    <!-- INPUT NODES                                     -->
    <!-- ----------------------------------------------- -->

    <g fill="#475569">

      <circle cx="690" cy="90" r="3"/>
      <circle cx="690" cy="150" r="3"/>
      <circle cx="690" cy="210" r="3"/>

    </g>


    <!-- ----------------------------------------------- -->
    <!-- HIDDEN NODES                                    -->
    <!-- ----------------------------------------------- -->

    <g fill="#64748b">

      <circle cx="760" cy="125" r="3.5"/>
      <circle cx="760" cy="185" r="3.5"/>

    </g>


    <!-- ----------------------------------------------- -->
    <!-- EMBEDDING NODES                                 -->
    <!-- ----------------------------------------------- -->

    <g fill="#60a5fa">

      <circle cx="835" cy="95" r="4"/>
      <circle cx="835" cy="155" r="5"/>
      <circle cx="835" cy="215" r="4"/>

    </g>


    <!-- ----------------------------------------------- -->
    <!-- REASONING NODES                                 -->
    <!-- ----------------------------------------------- -->

    <circle cx="915"
            cy="130"
            r="5"
            fill="#3b82f6"/>

    <circle cx="915"
            cy="195"
            r="4"
            fill="#60a5fa"/>


    <!-- ----------------------------------------------- -->
    <!-- OUTPUT NODES                                    -->
    <!-- ----------------------------------------------- -->

    <g fill="#64748b">

      <circle cx="990" cy="100" r="3.5"/>
      <circle cx="990" cy="160" r="4"/>
      <circle cx="990" cy="220" r="3.5"/>

    </g>


    <!-- Final output -->

    <circle cx="1070"
            cy="160"
            r="5"
            fill="#94a3b8"/>


    <!-- ================================================= -->
    <!-- FADING NODE PULSES                               -->
    <!-- ================================================= -->

    <!-- Pulse 1 -->

    <circle cx="835"
            cy="155"
            r="7"
            fill="none"
            stroke="#60a5fa"
            stroke-width="1"
            opacity="0">

      <animate
        attributeName="r"
        values="6;18;6"
        dur="3.5s"
        begin="0.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;0.35;0"
        dur="3.5s"
        begin="0.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Pulse 2 -->

    <circle cx="915"
            cy="130"
            r="7"
            fill="none"
            stroke="#3b82f6"
            stroke-width="1"
            opacity="0">

      <animate
        attributeName="r"
        values="6;20;6"
        dur="4s"
        begin="1.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;0.3;0"
        dur="4s"
        begin="1.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Pulse 3 -->

    <circle cx="990"
            cy="160"
            r="7"
            fill="none"
            stroke="#60a5fa"
            stroke-width="1"
            opacity="0">

      <animate
        attributeName="r"
        values="6;17;6"
        dur="3.8s"
        begin="2.4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;0.25;0"
        dur="3.8s"
        begin="2.4s"
        repeatCount="indefinite"/>

    </circle>


    <!-- ================================================= -->
    <!-- MOVING DATA PARTICLES                            -->
    <!-- ================================================= -->

    <circle r="2.5"
            fill="#93c5fd">

      <animateMotion
        dur="4s"
        repeatCount="indefinite"
        path="M690 150
              L760 125
              L835 155
              L915 130
              L990 160
              L1070 160"/>

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>


    <circle r="2"
            fill="#64748b">

      <animateMotion
        dur="5s"
        begin="1.8s"
        repeatCount="indefinite"
        path="M690 210
              L760 185
              L835 215
              L915 195
              L990 220
              L1070 160"/>

      <animate
        attributeName="opacity"
        values="0;0.8;0.8;0"
        dur="5s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- NETWORK LABELS                                    -->
  <!-- ================================================= -->

  <g font-family="monospace"
     font-size="8"
     letter-spacing="1.5"
     fill="#475569">

    <text x="680" y="78">
      INPUT
    </text>

    <text x="818" y="82">
      EMBEDDING
    </text>

    <text x="900" y="115">
      REASONING
    </text>

    <text x="978" y="91">
      OUTPUT
    </text>

  </g>


  <!-- ================================================= -->
  <!-- BORDER                                            -->
  <!-- ================================================= -->

  <rect x="0.5"
        y="0.5"
        width="1199"
        height="299"
        rx="16"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.07"/>

</svg>