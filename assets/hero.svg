<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="300"
     viewBox="0 0 1200 300">

  <defs>

    <!-- Background -->
    <linearGradient id="background"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Subtle glow -->
    <radialGradient id="blueGlow"
                    cx="75%"
                    cy="50%"
                    r="55%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#3b82f6" stop-opacity=".03"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".025"/>

    </pattern>

    <!-- Network line -->
    <linearGradient id="networkLine"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0" stop-color="#475569" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#94a3b8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#475569" stop-opacity=".15"/>

    </linearGradient>

  </defs>


  <!-- ============================== -->
  <!-- BACKGROUND                     -->
  <!-- ============================== -->

  <rect width="1200"
        height="300"
        rx="18"
        fill="url(#background)"/>

  <rect width="1200"
        height="300"
        rx="18"
        fill="url(#blueGlow)"/>

  <rect width="1200"
        height="300"
        rx="18"
        fill="url(#grid)"/>


  <!-- ============================== -->
  <!-- TEXT                           -->
  <!-- ============================== -->

  <g font-family="Arial, Helvetica, sans-serif">

    <text x="75"
          y="105"
          font-size="12"
          letter-spacing="5"
          fill="#64748b">
      PRATHMESH
    </text>

    <text x="72"
          y="158"
          font-size="46"
          font-weight="700"
          letter-spacing="-2"
          fill="#f1f5f9">
      BUILDING WITH AI
    </text>

    <text x="75"
          y="192"
          font-size="15"
          fill="#94a3b8">
      Exploring LLMs, RAG, machine learning &amp; backend systems
    </text>

    <text x="75"
          y="238"
          font-family="monospace"
          font-size="10"
          letter-spacing="2"
          fill="#475569">
      LLMs · RAG · ML · BACKEND · SYSTEMS
    </text>

  </g>


  <!-- ============================== -->
  <!-- NETWORK                        -->
  <!-- ============================== -->

  <g fill="none"
     stroke="url(#networkLine)"
     stroke-width="1">

    <!-- Input → Layer 1 -->

    <line x1="690" y1="90"  x2="760" y2="125"/>
    <line x1="690" y1="150" x2="760" y2="125"/>
    <line x1="690" y1="210" x2="760" y2="125"/>

    <line x1="690" y1="90"  x2="760" y2="185"/>
    <line x1="690" y1="150" x2="760" y2="185"/>
    <line x1="690" y1="210" x2="760" y2="185"/>


    <!-- Layer 1 → Layer 2 -->

    <line x1="760" y1="125" x2="835" y2="95"/>
    <line x1="760" y1="125" x2="835" y2="155"/>
    <line x1="760" y1="125" x2="835" y2="215"/>

    <line x1="760" y1="185" x2="835" y2="95"/>
    <line x1="760" y1="185" x2="835" y2="155"/>
    <line x1="760" y1="185" x2="835" y2="215"/>


    <!-- Layer 2 → Layer 3 -->

    <line x1="835" y1="95"  x2="915" y2="130"/>
    <line x1="835" y1="155" x2="915" y2="130"/>
    <line x1="835" y1="215" x2="915" y2="130"/>

    <line x1="835" y1="95"  x2="915" y2="195"/>
    <line x1="835" y1="155" x2="915" y2="195"/>
    <line x1="835" y1="215" x2="915" y2="195"/>


    <!-- Layer 3 → Output -->

    <line x1="915" y1="130" x2="990" y2="100"/>
    <line x1="915" y1="130" x2="990" y2="160"/>
    <line x1="915" y1="130" x2="990" y2="220"/>

    <line x1="915" y1="195" x2="990" y2="100"/>
    <line x1="915" y1="195" x2="990" y2="160"/>
    <line x1="915" y1="195" x2="990" y2="220"/>


    <!-- Final -->

    <line x1="990" y1="100" x2="1070" y2="160"/>
    <line x1="990" y1="160" x2="1070" y2="160"/>
    <line x1="990" y1="220" x2="1070" y2="160"/>

  </g>


  <!-- ============================== -->
  <!-- FADE ANIMATIONS                -->
  <!-- ============================== -->

  <g fill="none"
     stroke="#60a5fa"
     stroke-width="1.5">

    <!-- Wave 1 -->

    <path d="M690 90 L760 125 L835 95 L915 130 L990 100 L1070 160"
          opacity="0">

      <animate attributeName="opacity"
               values="0;0.7;0"
               dur="4s"
               repeatCount="indefinite"/>

    </path>


    <!-- Wave 2 -->

    <path d="M690 210 L760 185 L835 215 L915 195 L990 220 L1070 160"
          opacity="0">

      <animate attributeName="opacity"
               values="0;0.5;0"
               dur="4s"
               begin="2s"
               repeatCount="indefinite"/>

    </path>

  </g>


  <!-- ============================== -->
  <!-- NODES                          -->
  <!-- ============================== -->

  <g>

    <!-- Input -->

    <circle cx="690" cy="90" r="3" fill="#475569"/>
    <circle cx="690" cy="150" r="3" fill="#475569"/>
    <circle cx="690" cy="210" r="3" fill="#475569"/>


    <!-- Layer 1 -->

    <circle cx="760" cy="125" r="4" fill="#64748b"/>
    <circle cx="760" cy="185" r="4" fill="#64748b"/>


    <!-- Layer 2 -->

    <circle cx="835" cy="95" r="4" fill="#60a5fa"/>
    <circle cx="835" cy="155" r="5" fill="#60a5fa"/>
    <circle cx="835" cy="215" r="4" fill="#60a5fa"/>


    <!-- Central -->

    <circle cx="915" cy="130" r="5" fill="#3b82f6"/>
    <circle cx="915" cy="195" r="4" fill="#60a5fa"/>


    <!-- Output layer -->

    <circle cx="990" cy="100" r="4" fill="#64748b"/>
    <circle cx="990" cy="160" r="4" fill="#64748b"/>
    <circle cx="990" cy="220" r="4" fill="#64748b"/>


    <!-- Final -->

    <circle cx="1070"
            cy="160"
            r="5"
            fill="#94a3b8"/>

  </g>


  <!-- ============================== -->
  <!-- PULSING CENTRAL NODE           -->
  <!-- ============================== -->

  <circle cx="915"
          cy="130"
          r="8"
          fill="none"
          stroke="#3b82f6"
          stroke-width="1"
          opacity="0">

    <animate attributeName="r"
             values="6;20;6"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;0.35;0"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ============================== -->
  <!-- MOVING DATA                    -->
  <!-- ============================== -->

  <circle r="2.5"
          fill="#93c5fd">

    <animateMotion
      path="M690 150
            L760 125
            L835 155
            L915 130
            L990 160
            L1070 160"
      dur="4s"
      repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;1;1;0"
             dur="4s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ============================== -->
  <!-- LABELS                         -->
  <!-- ============================== -->

  <g font-family="monospace"
     font-size="8"
     letter-spacing="1.5"
     fill="#475569">

    <text x="680" y="78">INPUT</text>

    <text x="815" y="82">EMBEDDING</text>

    <text x="900" y="115">REASONING</text>

    <text x="980" y="91">OUTPUT</text>

  </g>


  <!-- ============================== -->
  <!-- BORDER                         -->
  <!-- ============================== -->

  <rect x="0.5"
        y="0.5"
        width="1199"
        height="299"
        rx="18"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.07"/>

</svg>